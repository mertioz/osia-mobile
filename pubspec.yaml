name: osia_mobile
description: "OSIA Mobile — companion app for the OSIA voice assistant."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.0
  cryptography: ^2.7.0
  web_socket_channel: ^3.0.2
  flutter_webrtc: 1.5.2
  multicast_dns: ^0.3.3+1
  just_audio: ^0.9.43
  record: ^6.2.1
  permission_handler: ^11.3.1
  mobile_scanner: ^7.4.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App icon generation. Sources are square crops derived from assets/osia_logo.png
# (see assets/osia_icon*.png). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/osia_icon.png"
  # iOS forbids transparency in icons — flatten the alpha onto white.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  # Android adaptive icon: purple swirl (padded for the safe zone) on white.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/osia_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/osia_logo.png
    - assets/osia_logo_mark.png
    - assets/production_capabilities.json
    - assets/guide/
