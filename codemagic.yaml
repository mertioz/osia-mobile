workflows:
  ios-release-candidate:
    name: OSIA iOS - App Store / TestFlight release candidate
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: osia-testflight
    environment:
      groups:
        - osia_app_store
      vars:
        BUNDLE_ID: space.osia.app
      flutter: 3.44.1
      xcode: 26.4
      cocoapods: 1.16.2
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Verify pinned Apple toolchain
        script: |
          set -e
          flutter --version
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          pod --version
      - name: Configure Flutter dependencies
        script: |
          set -e
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Analyze Flutter source
        script: flutter analyze
      - name: Run Flutter tests
        script: flutter test --exclude-tags guide-golden
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install --repo-update
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Fetch fresh App Store signing files
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificate to keychain
        script: keychain add-certificates
      - name: Verify canonical release version
        script: |
          set -e
          configured="$(sed -nE 's/^version:[[:space:]]+([^[:space:]]+)[[:space:]]*$/\1/p' pubspec.yaml)"
          if [ "$configured" != "1.1.2+16" ]; then
            echo "Expected canonical version 1.1.2+16, found $configured"
            exit 1
          fi
      - name: Apply standard App Store distribution profile
        script: xcode-project use-profiles
      - name: Build signed App Store IPA with canonical pubspec version
        script: |
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - OSIA Internal
        submit_to_app_store: false

  ios-testflight-internal:
    name: OSIA iOS - TestFlight internal
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: osia-testflight
    environment:
      groups:
        - osia_app_store
      vars:
        BUNDLE_ID: space.osia.app
      flutter: 3.44.1
      xcode: 26.4
      cocoapods: 1.16.2
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Verify pinned Apple toolchain
        script: |
          set -e
          flutter --version
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          pod --version
      - name: Configure Flutter dependencies
        script: |
          set -e
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Analyze Flutter source
        script: flutter analyze
      - name: Run Flutter tests
        script: flutter test --exclude-tags guide-golden
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install --repo-update
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Fetch fresh App Store signing files
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificate to keychain
        script: keychain add-certificates
      - name: Select available App Store Connect build number
        script: |
          set -e
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "APP_STORE_APPLE_ID is required in Codemagic group osia_app_store."
            exit 1
          fi
          configured="$(sed -nE 's/^version:[[:space:]]+[^+[:space:]]+\+([0-9]+)[[:space:]]*$/\1/p' pubspec.yaml)"
          case "$configured" in
            ''|*[!0-9]*)
              echo "pubspec.yaml must declare a numeric iOS build number."
              exit 1
              ;;
          esac
          queried="$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APPLE_ID" --platform IOS)"
          case "$queried" in
            '') latest=0 ;;
            *[!0-9]*)
              echo "Could not determine the latest App Store Connect build number."
              exit 1
              ;;
            *) latest="$queried" ;;
          esac
          if [ "$latest" -ge "$configured" ]; then
            selected=$((latest + 1))
          else
            selected="$configured"
          fi
          echo "IOS_BUILD_NUMBER=$selected" >> "$CM_ENV"
          echo "Selected iOS build number $selected"
      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          set -e
          flutter build ipa --release \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - OSIA Internal
        submit_to_app_store: false
