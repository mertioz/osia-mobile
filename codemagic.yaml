workflows:
  ios-release-candidate:
    name: OSIA iOS - App Store / TestFlight release candidate
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: osia-testflight
    environment:
      groups:
        - osia_app_store
      vars:
        BUNDLE_ID: space.osia.app
      flutter: 3.44.1
      xcode: 26.4
      cocoapods: 1.16.2
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Verify pinned Apple toolchain
        script: |
          set -e
          flutter --version
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          pod --version
      - name: Configure Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Analyze Flutter source
        script: flutter analyze
      - name: Run Flutter tests
        script: flutter test --exclude-tags guide-golden
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install --repo-update
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Fetch fresh App Store signing files
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificate to keychain
        script: keychain add-certificates
      - name: Select available App Store Connect build number
        script: |
          set -e
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "APP_STORE_APPLE_ID is required in Codemagic group osia_app_store."
            exit 1
          fi
          configured="$(sed -nE 's/^version:[[:space:]]+[^+[:space:]]+\+([0-9]+)[[:space:]]*$/\1/p' pubspec.yaml)"
          case "$configured" in
            ''|*[!0-9]*)
              echo "pubspec.yaml must declare a numeric iOS build number."
              exit 1
              ;;
          esac
          queried="$(app-store-connect get-latest-build-number \
            "$APP_STORE_APPLE_ID" --platform IOS --all-versions)"
          case "$queried" in
            '') echo 'App Store Connect maximum build is unknown.'; exit 1 ;;
            *[!0-9]*)
              echo "Could not determine the latest App Store Connect build number."
              exit 1
              ;;
            *) latest="$queried" ;;
          esac
          if [ "$latest" -ge "$configured" ]; then
            selected=$((latest + 1))
          else
            selected="$configured"
          fi
          echo "OSIA_IOS_STORE_MAX_BUILD=$latest" >> "$CM_ENV"
          echo "IOS_BUILD_NUMBER=$selected" >> "$CM_ENV"
          echo "Selected iOS build number $selected"
      - name: Apply standard App Store distribution profile
        script: xcode-project use-profiles
      - name: Build signed App Store IPA with verified monotonic build
        script: |
          set -e
          flutter build ipa --release \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
      - name: Verify signed iOS archive and exported identity
        script: python3 tool/verify_ios_artifact.py
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/OSIA-build-metadata.json
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload and internal group assignment only; beta review is a separate action.
        submit_to_testflight: false
        # Tester assignment is performed explicitly in App Store Connect.
        submit_to_app_store: false

  ios-testflight-internal:
    name: OSIA iOS - TestFlight internal
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: osia-testflight
    environment:
      groups:
        - osia_app_store
      vars:
        BUNDLE_ID: space.osia.app
      flutter: 3.44.1
      xcode: 26.4
      cocoapods: 1.16.2
