      - name: Verify pinned Apple toolchain
        script: |
          set -e
          flutter --version
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          pod --version
      - name: Configure Flutter dependencies
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Analyze Flutter source
        script: flutter analyze
      - name: Run Flutter tests
        script: flutter test --exclude-tags guide-golden
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install --repo-update
