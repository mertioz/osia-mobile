        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Analyze Flutter source
        script: flutter analyze
      - name: Run Flutter tests
        script: flutter test
      - name: Exclude integration-test plugin from the distribution archive
