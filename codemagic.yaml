          case "$queried" in
            '') echo 'App Store Connect maximum build is unknown.'; exit 1 ;;
            *[!0-9]*)
              echo "Could not determine the latest App Store Connect build number."
              exit 1
              ;;
            *) latest="$queried" ;;
